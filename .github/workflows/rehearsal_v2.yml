name: rehearsal-v2
on:
  workflow_dispatch:
    inputs:
      handson:
        description: "ハンズオンの番号（空白区切り）"
        default: "3"
permissions:
  contents: write
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g @devcontainers/cli
      - run: devcontainer up --workspace-folder .
      - run: devcontainer exec --workspace-folder . --remote-env RH_HANDSON="${{ inputs.handson }}" bash rehearsal/v2/run_v2.sh
        continue-on-error: true
      - name: 結果を results-v2 ブランチへ
        if: always()
        run: |
          mkdir -p /tmp/r && cp -r results/* /tmp/r/ 2>/dev/null || true
          git config user.name rehearsal && git config user.email rehearsal@example.com
          git checkout --orphan results-v2 && git rm -rqf . && cp -r /tmp/r/* . && git add -A && git commit -qm "results $(date -u +%FT%TZ)" && git push -f origin results-v2
