apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hitokoto
spec:
  parentRefs:
    - name: hitokoto-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hitokoto
          port: 80
