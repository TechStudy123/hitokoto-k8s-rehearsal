apiVersion: apps/v1
kind: Deployment
metadata:
  name: hitokoto
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hitokoto
  template:
    metadata:
      labels:
        app: hitokoto
    spec:
      containers:
        - name: app
          image: ghcr.io/container-nyumon/hitokoto:2.1
          env:
            - name: APP_TITLE
              valueFrom:
                configMapKeyRef:
                  name: hitokoto-config
                  key: APP_TITLE
            - name: DB_HOST
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/hitokoto
      volumes:
        - name: config
          configMap:
            name: hitokoto-config
