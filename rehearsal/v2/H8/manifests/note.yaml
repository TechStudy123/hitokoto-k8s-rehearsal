apiVersion: v1
kind: Pod
metadata:
  name: note
spec:
  containers:
    - name: note
      image: busybox:1.37
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: hitokoto-data
