# 壊れたアプリ その3（ハンズオン9）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop3
  template:
    metadata:
      labels:
        app: shop3
    spec:
      containers:
        - name: app
          image: ghcr.io/container-nyumon/hitokoto:2.1
---
apiVersion: v1
kind: Service
metadata:
  name: shop3
spec:
  selector:
    app: shop-3
  ports:
    - port: 80
      targetPort: 8000
